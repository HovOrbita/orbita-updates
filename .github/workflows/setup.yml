name: Orbita Setup.exe
on:
  push:
    branches: [setup-src]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: node prep.js
      - run: npx electron-builder --win --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Положить Setup.exe в ветку setup
        shell: bash
        run: |
          mkdir out && cp dist/Orbita-Trading-Setup.exe out/ && cd out
          sha256sum Orbita-Trading-Setup.exe > sha256.txt
          git init -q -b setup
          git add . && git -c user.name=orbita-bot -c user.email=bot@orbita.local commit -qm "Setup.exe ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" setup
      - uses: actions/upload-artifact@v4
        with:
          name: Orbita-Trading-Setup
          path: dist/Orbita-Trading-Setup.exe
