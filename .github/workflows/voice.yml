name: Orbita voice assets
on:
  push:
    branches: [voice-src]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  get:
    runs-on: ubuntu-latest
    steps:
      - name: Добавить английскую модель Vosk (Apache 2.0) к уже выложенным файлам
        run: |
          git clone -q --branch voice-assets --single-branch "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" out
          cd out
          curl -fsSL -o m.zip https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip
          unzip -q m.zip
          tar czf model-en.tar.gz vosk-model-small-en-us-0.15
          rm -rf m.zip vosk-model-small-en-us-0.15
          ls -la
          sha256sum vosk.js model-ru.tar.gz model-en.tar.gz > sha256.txt
          stat -c '%n %s' vosk.js model-ru.tar.gz model-en.tar.gz >> sha256.txt
          cat sha256.txt
          git add . && git -c user.name=orbita-bot -c user.email=bot@orbita.local commit -qm "English voice model"
          git push -q origin voice-assets
