<!doctype html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src https://api.binance.com https://data-api.binance.vision https://fapi.binance.com https://api.bybit.com https://www.okx.com https://api.gateio.ws https://api.mexc.com wss://stream.binance.com:9443 wss://stream.binance.com:443 wss://stream.binance.com wss://data-stream.binance.vision wss://fstream.binance.com:443 wss://fstream.binance.com">
  <title>Orbita Terminal</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <header id="topbar">
      <div class="brand" title="Orbita Terminal · сборка 23.11 16:45 (кнопка + всегда наверху)">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="3.2" fill="currentColor"/><ellipse cx="12" cy="12" rx="10" ry="4.6" transform="rotate(-30 12 12)" stroke="currentColor" stroke-width="1.6"/><circle cx="20.2" cy="7.4" r="1.6" fill="currentColor"/></svg>
        <span>Orbita</span>
      </div>
      <button id="symBtn" class="tb sym" title="Поиск символа (Ctrl+K или просто начните печатать)"></button>
      <div class="vsep"></div>
      <div id="intervals" class="seg"></div>
      <button id="ivMore" class="tb icon-only" title="Все интервалы"><svg class="ic" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 9l6 6 6-6"/></svg></button>
      <div class="vsep"></div>
      <button id="typeBtn" class="tb icon-only" title="Тип графика"></button>
      <button id="indBtn" class="tb" title="Индикаторы (Alt+I)"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l5-6 4 4 9-10M15 5h6v6"/></svg><span>Индикаторы</span></button>
      <button id="alertBtn" class="tb" title="Создать оповещение (Alt+A)"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16v-5a6 6 0 0 1 12 0v5l2 2H4zM10 20a2 2 0 0 0 4 0"/></svg><span>Оповещение</span></button>
      <div class="vsep"></div>
      <button id="replayBtn" class="tb" title="Повтор истории (Bar Replay)"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.3-5.7M4 4v4h4M10 9v6l5-3z"/></svg><span>Повтор</span></button>
      <div class="vsep"></div>
      <button id="winBtn" class="tb icon-only" title="Новое окно — можно унести на другой монитор (Ctrl+N)"></button>
      <button id="layoutBtn" class="tb" title="Сколько графиков на экране (1–10)"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 4h18v16H3zM12 4v16M3 12h9"/></svg></button>
      <button id="savedBtn" class="tb" title="Сохранённые раскладки"></button>
      <button id="undoBtn" class="tb icon-only" title="Отменить (Ctrl+Z)"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
      <button id="redoBtn" class="tb icon-only" title="Повторить (Ctrl+Y)"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14l5-5-5-5M20 9H10a6 6 0 0 0 0 12h3"/></svg></button>
      <div class="grow"></div>
      <button id="musicBtn" class="tb icon-only" title="Спокойная музыка"></button>
      <button id="voiceBtn" class="tb icon-only" title="Озвучка свечей"></button>
      <button id="calChip" class="cal-chip" hidden></button>
      <button id="netStatus" class="net"></button>
      <button id="shotBtn" class="tb icon-only" title="Снимок графика с подписью (Alt+S) — сохраняется и копируется для чата"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M4 8h4l2-3h4l2 3h4v11H4zM8.5 13a3.5 3.5 0 1 0 7 0a3.5 3.5 0 1 0-7 0"/></svg></button>
      <button id="phoneBtn" class="tb icon-only" title="Orbita на телефоне и ноутбуке"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2.5" width="10" height="19" rx="2.2"/><path d="M11 18.5h2"/></svg></button>
      <button id="updBtn" class="tb icon-only upd-btn" title="Обновить программу"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg><i class="upd-dot" hidden></i></button>
      <button id="setBtn" class="tb icon-only" title="Настройки"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M9 12a3 3 0 1 0 6 0a3 3 0 1 0-6 0M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg></button>
      <button id="themeBtn" class="tb icon-only" title="Сменить тему"></button>
      <button id="fsBtn" class="tb icon-only" title="Полный экран"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg></button>
    </header>
    <div id="main">
      <nav id="tools"></nav>
      <section id="center">
        <div id="charts"></div>
      </section>
      <aside id="side">
        <div id="side-resizer" title="Потяните, чтобы изменить ширину панели (двойной клик — сброс)"></div>
        <div id="side-body"></div>
        <div id="side-rail">
          <button data-tab="watch" title="Список наблюдения"><svg class="ic" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg></button>
          <button data-tab="alerts" title="Оповещения"><svg class="ic" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16v-5a6 6 0 0 1 12 0v5l2 2H4zM10 20a2 2 0 0 0 4 0"/></svg><span id="alertBadge" class="rail-badge"></span></button>
          <button data-tab="acct" title="Мои позиции на биржах (Binance, Bybit, Gate)"><svg class="ic" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h16v11H4zM9 8V5h6v3M4 13h16M11 13v2h2v-2"/></svg></button>
          <button data-tab="cal" title="Календарь событий: ФРС, инфляция, занятость США и свои"><svg class="ic" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16v14H4zM4 10h16M8 3v5M16 3v5M8 14h2M14 14h2M8 17h2"/></svg></button>
          <button data-tab="objects" title="Дерево объектов"><svg class="ic" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M4 4h6v6H4zM4 14h6v6H4zM14 7h6M14 17h6"/></svg></button>
        </div>
      </aside>
    </div>
  </div>
  <div id="drawbar" hidden></div>
  <div id="modal-root"></div>
  <div id="toasts"></div>

  <script src="js/icons.js"></script>
  <script src="js/util.js"></script>
  <script src="js/data.js"></script>
  <script src="js/indicators.js"></script>
  <script src="js/drawings.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/chart.js"></script>
  <script src="js/corr.js"></script>
  <script src="js/funding.js"></script>
  <script src="js/panels.js"></script>
  <script src="js/voice.js"></script>
  <script src="js/news.js"></script>
  <script src="js/calendar.js"></script>
  <script src="js/accounts.js"></script>
  <script src="js/updates.js"></script>
  <script src="js/phone.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
